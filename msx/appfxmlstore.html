var logger = new TVXLogger();
function parserstr(pars,s){
	var x1=-1,x2=-1;
	if(pars[2]=="" && pars[1]=="") var text=s;
	else if(pars[1] == "RegExp"||pars[1] == "regexp"){
		s=s.replace(/\n/g,"").replace(/\r/g,"");					
		try {
			regexp= new RegExp(pars[2],(pars[3]||""));										
			items=regexp.exec(s);
			var ind=parseInt(pars[4])||0;
			if(isNaN(ind)) ind=0;
			text=items[ind];
		} catch (e) {TVXInteractionPlugin.error("Parse RegExp error "+lParams["parser"]+" failed: " + e.message);}						
	}
	else if(pars[1].indexOf(".*?")>=0||pars[2].indexOf(".*?")>=0){
		s=s.replace(/\n/g,"").replace(/\r/g,"");					
		try {
			pg=pars[1]+'(.*?)'+pars[2];
			regexp= new RegExp(pg,"i");										
			items=regexp.exec(s);							
			text=items[1];
		} catch (e) {TVXInteractionPlugin.error("RegExp Parse error "+lParams["parser"]+" failed: " + e.message);}
	}
	else{
		x1=(pars[1]=="") ? 0 : s.indexOf(pars[1]);
		if(x1>-1) x1+=pars[1].length;
		else return "";
		x2=(pars[2]=="") ? -2 : s.indexOf(pars[2],x1);
		if(x2==-2) text=s.substr(x1);
		else if(x2==-1) return "";
		else text=s.substr(x1, x2-x1);	
	}
	return text;
}
var allapps,myapps=[],mylinks=null,box_mac="nonundefined",defapps=[];
function getBasePage(m){
	var p={};
	$.each(allapps, function(i, v) {
		if(i!="items") p[i]=v;
		if(m&&i=="items") {
			p[i]=[];
			defapps=[];
			$.each(v, function(ii, vv) {
				if(ii < 4) p[i].push(vv);
				else if(String(vv.label || "").indexOf("Fork browser") >= 0) defapps.push(vv);
			});
		}
		});
	return p;
}

function findItemById(array, id) {
    for (var i = 0; i < array.length; i++) {
        if (array[i].id === id) {
            return array[i];
        }
    }
    return null;
}
function findIndexItemById(array, id) {
    for (var i = 0; i < array.length; i++) {
        if (array[i].id === id) {
            return i;
        }
    }
    return -1;
}
function findIndexItem(array, id) {
    for (var i = 0; i < array.length; i++) {
        if (array[i] === id) {
            return i;
        }
    }
    return -1;
}

function categoryName(cat) {
    if (!cat || typeof cat !== "string") return "";
    var cats = (cat.indexOf(",") >= 0) ? cat.split(",") : [cat];
    var names = [];

    for (var i = 0; i < cats.length; i++) {
        var code = cats[i].trim();
        if (code === "") continue;
        for (var j = 0; j < categorylink.data.items.length; j++) {
            var item = categorylink.data.items[j];
            if (item.category === code) {
                names.push(item.label);
                break;
            }
        }
    }
    return names.join(", ");
}
function getAppById(id) {
    var parts = id[1].split("-");
    var index = parseInt(parts[1]);
    
    if (!isNaN(index) && defapps[index]) {
        return defapps[index];
    } else {
        return findItemById(allapps.items, id[1]) || findItemById(mylinks, id[1]);
    }
}

				  success: function(data)

					// GitHub Pages: Content-Type application/json → jQuery already parsed

					//logger.debug(allapps);					
				  },
				  error: function (xhr, ajaxOptions, thrownError) {
					TVXInteractionPlugin.error("Ошибка получения списка приложений{br}status: " + xhr.status+" "+thrownError);
				  }
				}).done(function() {
					TVXInteractionPlugin.executeAction("interaction:busy:stop:parsload");	
				});
			
		}
		if(dataId.indexOf("edit|")==0) {
			var id=dataId.split("|");
			var index = myapps.indexOf(id[1]);
			var app=getAppById(id);
			if(app&&startaction==app.action){
				lStorage.remove("START_ACTION");
				TVXInteractionPlugin.success("Удалено из приложений и автозапуска!");
			}
			if(index>=0){
				if(id[2]=="delete"){
					myapps.splice(index,1);
					var foundIndex = findIndexItemById(mylinks,id[1]);
					if (foundIndex !== -1) {
						mylinks.splice(foundIndex, 1);
						lStorage.set("mylinks",JSON.stringify(mylinks));
						
					}					
				}
				if(id[2]=="left"&&index>0) myapps.splice(index - 1, 0, myapps.splice(index, 1)[0]);				
				else if(id[2]=="right"&&index<myapps.length-1)  myapps.splice(index + 1, 0, myapps.splice(index, 1)[0]);

function addItem(el, size, cat, sort) {
    el.layout = coords[0] + "," + coords[1] + "," + size[0] + "," + size[1];
	if(cat||cat==="") {
		for (var i = 0; i < el.data.items.length; i++) {

		}
	}
    if (inpage === null) inpage = { items: [], type: "list" };
	el.focus=false;
    inpage.items.push(el);

    coords[0] += size[0];
    if (coords[0] >= maxCoords[0]) {
        coords[0] = 0;
        coords[1] += size[1];
        if (coords[1] >= maxCoords[1]) {
            page.pages.push(inpage);
            inpage = null;
            coords = [0, 0];
        }
    }
