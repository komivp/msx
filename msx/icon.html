            var createIconItem = function (iconData) {
                return {
                    title: iconData.title,
                    icon: "msx-white-soft:" + iconData.icon,
                    action: "interaction:commit",
                    data: { action: "icon:select:" + iconData.icon }
                };
            };

            var createIconList = function () {
                return iconList.map(createIconItem);
            };

            var panel = {
                type: "list",
                headline: lParams.title || "Выберите иконку",
                template: {
                    type: "separate",
                    layout: "0,0,1,2",
                    color: "msx-glass",
                    icon: "msx-white-soft:movie",
                    iconSize: "medium"
                },
                items: createIconList()
            };

            this.init = function () {};

            this.ready = function () {};

            this.handleData = function (data) {
                console.log("handleData", data);
                console.log("lParams", lParams);
                try{
                if (data.data && data.data.action.startsWith("icon:select:")) {
                    var selectedIcon = data.data.action.replace("icon:select:", "");
                    if(lParams["playlist_url"].indexOf("http")==0) TVXInteractionPlugin.executeAction("content:"+lParams["playlist_url"].replace("{search}",encodeURIComponent(searchInput)));
                    else if(lParams["playlist_url"].indexOf("payd_")==0){
                        if(lParams["parent_url"].indexOf("?")==-1) lParams["parent_url"]+="?";
                        else lParams["parent_url"]+="&";
                        lParams["parent_url"]+="payd["+lParams["playlist_url"]+"]="+encodeURIComponent(selectedIcon);
                        TVXInteractionPlugin.executeAction("content:"+lParams["parent_url"]);
                    }
                }
            }catch(e){
                console.error("Error in handleData:", e);
            }
            };

            this.handleRequest = function (dataId, data, callback) {
                if (dataId === "init") {
                    callback(panel);
                } else {
                    callback();
                }
            };
        }

        window.onload = function () {
            TVXInteractionPlugin.setupHandler(new IconHandler());
            TVXInteractionPlugin.init();
        };
    </script>
