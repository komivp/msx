var MAX_INPUT_LENGTH = 256;
var MAX_PAGE_X = 10;
var MAX_PAGE_Y = 6;
var SEARCH_HEADLINE = "{INPUT}";
var lStorage = new TVXStorage();
var enteresObj=JSON.parse(lStorage.get("enteres",'[{"n":"http://"},{"n":"https://"}]'))||[];

var m=location.href.match(new RegExp("el=(.*?)(&|$|#)"));
if(m) var lParams=JSON.parse(decodeURIComponent(m[1]))||{};
else lParams={};
lParams.value=lParams.value||"";
lParams.type=lParams.type||"";
lParams.title=lParams.title||"";
if(lParams["search_on"]=="search_on") lParams["search_on"]="Введите текст";
var RESULTS_HEADLINE = lParams["search_on"];

var createInputButton = function(input, key, x, y) {
    return {
        type: "button",
        layout: x + "," + y + ",1,1",
        label: input,
        key: key,
        action: "interaction:commit",
        data: {
            action: "search:input:" + input
        }
    };
};
var createControlButton = function(control, key, x, y) {
    var label = null;
	var w=1;
    if (control == "back") {
        label = "{ico:backspace}";
    } else if (control == "clear") {
        label = "{ico:clear}";
    } else if (control == "space") {
		w=2;
        label = "{ico:space-bar}";
    }else if (control == "space") {
        label = "{ico:space-bar}";
    }else if (control == "language") {
        label = "{ico:language}";
    }else if (control == "done") {
		x++;
		w=2;
        label = "{ico:keyboard-return}";
    }else if (control == "shift") {
        label = "{ico:arrow-upward}";
    }else if (control == "left") {
        label = "{ico:keyboard-arrow-left}";
    }else if (control == "right") {
        label = "{ico:keyboard-arrow-right}";
    }
	
    return {
        type: "button",
		id: control,
        layout: x + "," + y + ","+w+",1",
        label: label,
        key: key,
        action: "interaction:commit",
        data: {
            action: "search:control:" + control
        }
    };
};
var VK={
	shift:0,
	Keyboard:null,
	/*US:[ // US Standard Keyboard
		       [["1", "!"], ["2", "@"], ["3", "#"], ["4", "$"], ["5", "%"], ["6", "^"], ["7", "&"], ["8", "*"], ["9", "("], ["0", ")"], ["clear"], ["back"]],
		       [["q", "Q"], ["w", "W"], ["e", "E"], ["r", "R"], ["t", "T"], ["y", "Y"], ["u", "U"], ["i", "I"], ["o", "O"], ["p", "P"], ["[", "]"],["language"]],
		       [["a", "A"], ["s", "S"], ["d", "D"], ["f", "F"], ["g", "G"], ["h", "H"], ["j", "J"], ["k", "K"], ["l", "L"], [":", ";"], ["/", "?"],["done"]],
		       [["z", "Z"], ["x", "X"], ["c", "C"], ["v", "V"], ["b", "B"], ["n", "N"], ["m", "M"], ["_", "."], ["@", "-"], ["'", "\""], ["space"],["shift"]],
		       ],
	Kir:[ // Russian Standard Keyboard
		       [["1", "\\"], ["2", '"'], ["3", "\u2116"], ["4", ";"], ["5", "|"], ["6", ":"], ["7", "~"], ["8", "+"], ["9", "="],["0", ","], ["clear"], ["back"]],
		       [["\u0439", "\u0419"], ["\u0446", "\u0426"], ["\u0443", "\u0423"], ["\u043A", "\u041A"], ["\u0435", "\u0415"], ["\u043D", "\u041D"], ["\u0433", "\u0413"], ["\u0448", "\u0428"], ["\u0449", "\u0429"], ["\u0437", "\u0417"], ["\u0445", "\u0425"],["language"]],
		       [["ф", "Ф"], ["\u044B", "і"], ["\u0432", "\u0412"], ["\u0430", "\u0410"], ["\u043F", "\u041F"], ["\u0440", "\u0420"], ["\u043E", "\u041E"], ["\u043B", "\u041B"], ["\u0434", "\u0414"], ["\u0436", "\u0416"], ["\u044D", "є"], ["done"]],
		       [["\u044F", "\u042F"], ["\u0447", "\u0427"], ["\u0441", "\u0421"], ["\u043C", "\u041C"], ["\u0438", "\u0418"], ["\u0442", "\u0422"], ["\u044C", "\u042C"], ["\u0431", "\u0411"], ["\u044E", "\u042E"], ["\u0401","ї"], ["space"],["shift"]],
	]	*/
	US:[ // US Standard Keyboard
		       [["1", "!"], ["2", "@"], ["3", "#"], ["4", "$"], ["5", "%"], ["6", "^"], ["7", "&"], ["8", "*"], ["9", "("], ["0", ")"]],
		       [["q", "Q"], ["w", "W"], ["e", "E"], ["r", "R"], ["t", "T"], ["y", "Y"], ["u", "U"], ["i", "I"], ["o", "O"], ["p", "P"]],
		       [["a", "A"], ["s", "S"], ["d", "D"], ["f", "F"], ["g", "G"], ["h", "H"], ["j", "J"], ["k", "K"], ["l", "L"], [":", ";"]],
		       [["z", "Z"], ["x", "X"], ["c", "C"], ["v", "V"], ["b", "B"], ["n", "N"], ["m", "M"], [".", "_"], ["@", "["], ["'", "\""]],
			   [["shift"],  ["/", "?"], ["-", "]"], ["clear"],  ["back"],  ["language"],["space"],  ["done"]]
		       ],
	Kir:[ // Russian Standard Keyboard
		       [["1", "\\"], ["2", '"'], ["3", "\u2116"], ["4", ";"], ["5", "|"], ["6", ":"], ["7", "~"], ["8", "+"], ["\u0445", "\u0425"], ["\u044D", "є"]],
		       [["\u0439", "\u0419"], ["\u0446", "\u0426"], ["\u0443", "\u0423"], ["\u043A", "\u041A"], ["\u0435", "\u0415"], ["\u043D", "\u041D"], ["\u0433", "\u0413"], ["\u0448", "\u0428"], ["\u0449", "\u0429"], ["\u0437", "\u0417"]],
		       [["ф", "Ф"], ["\u044B", "і"], ["\u0432", "\u0412"], ["\u0430", "\u0410"], ["\u043F", "\u041F"], ["\u0440", "\u0420"], ["\u043E", "\u041E"], ["\u043B", "\u041B"], ["\u0434", "\u0414"], ["\u0436", "\u0416"]],
		       [["\u044F", "\u042F"], ["\u0447", "\u0427"], ["\u0441", "\u0421"], ["\u043C", "\u041C"], ["\u0438", "\u0418"], ["\u0442", "\u0422"], ["\u044C", "\u042C"], ["\u0431", "\u0411"], ["\u044E", "\u042E"], ["\u0401","ї"]],
			   [["shift"], ["9", "="],["0", ","], ["clear"], ["back"],["language"], ["space"], ["done"]]
	]
}
function lItems(lang){
	var res=[];
	VK.Keyboard=lang;
	for (i in VK.Keyboard) {
		for (j in VK.Keyboard[i]) {	  
			if(VK.Keyboard[i][j].length==1) var vshift=0;
		    else vshift=VK.shift; 
			var but=VK.Keyboard[i][j][vshift];
			if(VK.Keyboard[i][j].length==1)  res.push(createControlButton(but, but, j, i));
			else res.push(createInputButton(but, but, j, i));
		}
	}
	return res;
}

var inputPage = {
    language:'Eng',
    headline: null,
    offset: "0,0,0,0.1",
    items: lItems(VK.US)
};
var inputQick = {
    headline: null,
    offset: "0,0,0,0.1",
    items: []
};
var search = {
	"compress": true,
    cache: false,
    type: "list",
    important: true,
    headline: null,
    //transparent: 2,
    template: {
        type: "separate",
        layout: "0,0,2,4",
    },
    pages: null
};
var defS="";
/******************************************************************************/

/******************************************************************************/
//SearchHandler
/******************************************************************************/
function SearchHandler() {
    var searchInput = lParams["value"];
    var testItems = null;
    var resultItems = null;
	if(lParams.title.match(/earch|find|оиск|ошук/i)&&lParams.type!="password") defS="http://omnibox.spiderxml.com/?type=all&from=fxmlmsx";
	else defS="";
    var searchURL = lParams["presearch"]||defS;

    var createPages = function(items, filterCallback, itemCallback, pageCallback) {
        var x = 0;
        var y = 0;
        var w = 2;
        var h = 4;
        var page = null;
        var index = 0;


        //Create icons
        if (items != null && items.length > 0) {
            for (var i in items) {
                var item = items[i];
                    var pageItem = {
                        type: "separate",
                        layout: x + "," + y + "," + w + "," + h,
                        badge: (item.badge) ? item.badge : null,
                        badgeColor: (item.badgeColor) ? item.badgeColor : null,
                        title: (item.title) ? item.title : null,
                        titleFooter: (item.titleFooter) ? item.titleFooter : null,
                        image: (item.image) ? item.image : null,
                        imageFiller: (item.imageFiller) ? item.imageFiller : null,
                        action: (item.action) ? item.action : null,
                        data: (item.data) ? item.data : null,
                    };
                    itemCallback(item, pageItem, index);
                    if (page == null) {
                        page = {
                            items: []
                        };
                        pageCallback(page);
                    }
                    page.items.push(pageItem);
                    x += w;
                    if (x + w > MAX_PAGE_X) {
                        x = 0;
                        y += h;
                        if (y + h > MAX_PAGE_Y) {
                            y = 0;
                            page = null;
                        }
                    }
                    index++;
            }
        }
    };
    var handleSearchInput = function(input) {
        if (searchInput.length < MAX_INPUT_LENGTH) {
            searchInput += input;
			lgetQuick();
        }
    };
	function lRenderQuick(){
		var items=[], kk=0,jj=0;
		for(var i in testItems){			
			if(kk>5) break;
			items.push({
				type: "default",
				layout: (jj*3) + "," + kk + ",3,1",
				label: testItems[i]["source"]+" "+testItems[i]["q"],
				action: "interaction:commit",
				data: {
					action: "search:init:" + testItems[i]["q"]
				}
			});
			jj++;
			if(jj>2) {jj=0;	kk++;}					
			//break;
		}
		inputQick={items:items};
		TVXInteractionPlugin.executeAction("reload:panel");
	}
	function lgetQuick(){
		testItems=[];
		for(var i in enteresObj){
			if(String(enteresObj[i]["n"]).indexOf(searchInput)==0) testItems.push({"q":enteresObj[i]["n"],"type":"last","img":"","source":"{ico:history}"});	  	
			if(searchInput==""&&testItems.length>10&&searchURL) break;
		}
		lRenderQuick();
	    if(searchURL) {
            var searchToken = TVXTools.strTrim(searchInput);
            TVXServices.ajax.get(searchURL+"&presearch="+encodeURI(searchToken), {
                success: function(data) {					
					for(var i in data){
						if(typeof data[i]=="object"){
							if(data[i]["type"]&&data[i]["type"]=="web") var q=data[i]["q"];
							else continue;
						}
						else q=data[i];
						testItems.push({"q":q,"type":"quick","img":"","source":""});
					}
					lRenderQuick();
                },
                error: function(error) {
					lParams["presearch"]=defS;
                    //TVXInteractionPlugin.error("Quick search url failed: " + error);
                }
            });

            
        }
	
	}
	var  saveQuickEnteres=function(s){
		var c=this;
		if(lParams["search_on"].match(/(пароль|password)/i)||lParams["title"].match(/(пароль|password)/i)||lParams.type=="password") return;
		var tmp=null;		
		for(var i in enteresObj){
			if(enteresObj[i]["n"]==s){
				tmp=enteresObj.splice(i,1)[0];
				enteresObj.unshift(tmp);
				break;
			}
		}
		if(tmp==null){
			tmp={"n":s};
			enteresObj.unshift(tmp);
		}
		if(enteresObj.length>300) enteresObj.splice(300,1)
		lStorage.set("enteres",JSON.stringify(enteresObj));
		
	}
    var handleSearchControl = function(control) {
        if (control == "back") {
            if (searchInput.length > 0) {
                searchInput = searchInput.substr(0, searchInput.length - 1);
            }
			lgetQuick();
        } else if (control == "clear") {
            searchInput = "";
			lgetQuick();
        } else if (control == "space") {
            if (searchInput.length > 0 && searchInput.length < MAX_INPUT_LENGTH && searchInput[searchInput.length - 1] != " ") {
                searchInput += " ";
            }
        }
		else if (control == "done") {
			if(searchInput!==""){
				saveQuickEnteres(searchInput);
				if(lParams["playlist_url"].indexOf("http")==0)
					TVXInteractionPlugin.executeAction("content:"+lParams["playlist_url"].replace("{search}",encodeURIComponent(searchInput)));
				else if(lParams["playlist_url"].indexOf("payd_")==0){
					//TVXServices.storage.set(lParams["playlist_url"],searchInput);
					if(lParams["parent_url"].indexOf("?")==-1) lParams["parent_url"]+="?";
					else lParams["parent_url"]+="&";
					lParams["parent_url"]+="payd["+lParams["playlist_url"]+"]="+encodeURIComponent(searchInput);
					TVXInteractionPlugin.executeAction("content:"+lParams["parent_url"]);
				}
			}
			
		}
        else if (control == "language"||control == "shift") {
			if (control == "shift") {
				VK.shift=VK.shift?0:1;
				inputPage.items=lItems(VK.Keyboard);
			}
            else {
				VK.shift=0;
				if(inputPage.language === 'RU'){
					inputPage.language='EN';
					inputPage.items=lItems(VK.US);
					
				}else{
					inputPage.language='RU';
					inputPage.items=lItems(VK.Kir);
				}
			}
        } else {
            TVXInteractionPlugin.warn("Unknown search control: '" + control + "'");
        }
    };
    var updateSearch = function() {
		if(lParams.type=="password") search.headline = SEARCH_HEADLINE.replace("{INPUT}", searchInput.replace(/./g,"*"));
        else {
			if(searchInput.length>40) var text="..."+searchInput.substr(-40);
			else text=searchInput;
			search.headline = SEARCH_HEADLINE.replace("{INPUT}", text);
		}
        search.pages = [inputPage,inputQick];
        resultItems = [];

        //Filter icons

		inputPage.headline = RESULTS_HEADLINE;
    };
    var reloadSearch = function(m) {
        //updateSearch();
        TVXInteractionPlugin.executeAction("reload:panel");
		if(m){
		 TVXInteractionPlugin.executeAction("focus:done");
		}
		
    };

    this.init = function() {
        //Placeholder
			lgetQuick();
    };
    this.ready = function() {
        //Placeholder
    };
    this.handleData = function(data) {
		//console.log(data);
        if (data.data != null && TVXTools.isFullStr(data.data.action)) {
            var action = data.data.action;
            if (action.indexOf("search:") == 0) {
                var searchAction = action.substr(7);
                if (searchAction.indexOf("init:") == 0) {
                    searchInput = searchAction.substr(5);
                    updateSearch(); 
					reloadSearch(1);
                } else if (searchAction.indexOf("input:") == 0) {
                    handleSearchInput(searchAction.substr(6));
                    reloadSearch();
                } else if (searchAction.indexOf("control:") == 0) {
                    handleSearchControl(searchAction.substr(8));
                    reloadSearch();
                } else if (searchAction == "reload") {
                    reloadSearch();
                } else {
                    TVXInteractionPlugin.warn("Unknown search action: '" + searchAction + "'");
                }
            } else {
                TVXInteractionPlugin.warn("Invalid search action: '" + action + "'");
            }
        } else {
            TVXInteractionPlugin.warn("Unknown search data");
        }
    };
	var cthis=this;
    this.handleRequest = function(dataId, data, callback) {
        if (dataId == "init") {
            updateSearch();
            callback(search);
            /*
            setupTestItems(function() {
                callback(search);
            });
            */
        } else {
            TVXInteractionPlugin.warn("Unknown request data ID: '" + dataId + "'");
            callback();
        }
    };
}
/******************************************************************************/

/******************************************************************************/
//Setup
/******************************************************************************/
window.onload = function() {
    TVXInteractionPlugin.setupHandler(new SearchHandler());
    TVXInteractionPlugin.init();
};
/******************************************************************************/
</script>
